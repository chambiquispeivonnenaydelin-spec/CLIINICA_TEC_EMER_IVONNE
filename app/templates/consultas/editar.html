{% extends "layout.html" %}

{% block title %}Editar consulta{% endblock %}

{% block content %}
<div class="card shadow-sm border-0">
    <div class="card-body">
        <h1 class="mb-4">Editar consulta</h1>

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Fecha</label>
                <input type="date" name="fecha" class="form-control"
                       value="{{ consulta.fecha.strftime('%Y-%m-%d') }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Diagnóstico</label>
                <input type="text" name="diagnostico" class="form-control"
                       value="{{ consulta.diagnostico }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Tratamiento</label>
                <input type="text" name="tratamiento" class="form-control"
                       value="{{ consulta.tratamiento }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Médico</label>
                <select name="medico_id" class="form-select" required>
                    {% for medico in medicos %}
                    <option value="{{ medico.id }}" {% if medico.id == consulta.medico_id|int %}selected{% endif %}>
                        {{ medico.nombre }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Paciente</label>
                <select name="paciente_id" class="form-select" required>
                    {% for paciente in pacientes %}
                    <option value="{{ paciente.id }}" {% if paciente.id == consulta.paciente_id|int %}selected{% endif %}>
                        {{ paciente.nombre }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn btn-primary">Guardar cambios</button>
            <a href="{{ url_for('consulta.listar_consultas') }}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
